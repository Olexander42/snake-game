<!DOCTYPE html>
<html lang='en'>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="./main.css">
    <script type='module' src="./entry.js" defer></script>
    <style></style>
    <title>Snake Game</title>
  </head>

  <body> 
    <div id="container">
      <div id="background"></div>
      <div id="border">
        <div id="menu">
          <div id="main-menu">
            <button id="start-btn">Start</button>
            <button id="settings-btn">Settings</button>
          </div>
          <div id="settings-menu">
            <button id="size-btn">
              <div class="front side">
                <span>Size</span>
              </div>
              <div class="rear side">
                <fieldset id="size">
                  <input type='range' id="size-slider" name="size-slider" min='40' max='80' value='60' step='20' list="markers"/>
                  <datalist id="markers">
                    <option value='40' label="Small" tabindex="0"></option>
                    <option value='60' label="Normal" tabindex="0"></option>
                    <option value='80' label="Large" tabindex="0"></option>
                  </datalist>
                </fieldset>
              </div>
            </button>
            <button id="snake-color">
              <div class="front side">
                <span>Snake Color</span>
              </div>
              <div class="rear side">
                <fieldset id="color-set">
                  <span id="color-box-outline" class="outline"></span>
                  <label>
                    <input type='radio' name="snake-color" id="green" value='hsl(120, 40%, 30%)' checked>
                    <span class="color-box option" style='background-color: hsl(120, 40%, 30%)' tabindex='0'></span>
                  </label>
                  <label>
                    <input type='radio' name="snake-color" id="red" value='hsl(0, 70%, 40%)'>
                    <span class="color-box option" style='background-color: hsl(0, 70%, 40%)' tabindex='0'></span>
                  </label>
                  <label>
                    <input type='radio' name="snake-color" id="blue" value='hsl(210, 70%, 40%)'>
                    <span class="color-box option" style='background-color: hsl(210, 70%, 40%)' tabindex='0'></span>
                  </label>

                </fieldset>
              </div>
            </button>
            <button id="theme">
              <div class="front side">
                <span>Theme</span>
              </div>
              <div class="rear side">
                <fieldset id="theme-set">
                  <span id="thumbnail-outline" class="outline"></span>
                  <label>
                    <input type='radio' name="theme" id="urban" value="urban" checked>
                    <span class="thumbnail option" tabindex='0'></span>
                    <span>Urban</span>
                  </label>
                  <label>
                    <input type='radio' name="theme" id="aqua" value="aqua">
                    <span class="thumbnail option" tabindex='0'></span>
                    <span>Aqua</span>
                  </label>
                </fieldset>
              </div>
            </button>
            <button id="back-btn">Back ↩</button>
          </div>
        </div>
        <div id="score">Score: 0</div>
        <div id="record">Record: 0</div>
        <div id="sound-icon" class="sound-off" tabindex='0'>
          <img src="../assets/sound-off-icon.jpg" id="sound-off-icon" alt="sound off icon" >
          <img src="../assets/sound-on-icon.jpg" id="sound-on-icon" alt="sound on icon" >
        </div>
      </div>
      <div id="snake"></div>
      <span id="food"></span>
    </div>
  </body>
</html>
